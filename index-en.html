<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>if(localStorage.getItem('tema')==='claro'){document.documentElement.setAttribute('data-tema','claro');}</script>
  <title>Douglas N. Schimidt — Adventure Photography</title>
  <meta name="description" content="Adventure and nature photography — surf, hiking, climbing." />
  <link rel="alternate" hreflang="pt-BR" href="https://douglasnschimidt.com/index.html" />
  <link rel="alternate" hreflang="en" href="https://douglasnschimidt.com/index-en.html" />
  <link rel="alternate" hreflang="x-default" href="https://douglasnschimidt.com/index.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@400;600&family=Karla:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estilo.css" />

  <style>
    /* ══════════════════════════════════════════════════
       HERO — full-screen photo
    ══════════════════════════════════════════════════ */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* BACKGROUND PHOTO */
    .hero-foto {
      position: absolute;
      inset: 0;
      background-image: url('DNS09559.jpg');
      background-size: cover;
      background-position: center;
    }

    /* Light darkening — photo stays clearly visible */
    .hero-escuro {
      position: absolute;
      inset: 0;
      background: rgba(13,13,13,0.32);
    }

    /* Text area — centered on the landing page */
    .hero-texto {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 2rem;
    }

    .hero-nome { display: none; }
    .hero-descricao { display: none; }

    /* Horizontal menu — handwriting font, white, no background */
    .hero-menu {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.8s forwards;
      position: relative;
      z-index: 10;
      background: none;
    }

    .hero-menu a {
      font-family: 'LapisDeArtista', 'Caveat', cursive;
      font-size: clamp(1.6rem, 2.8vw, 2.4rem);
      color: #ffffff;
      letter-spacing: 0.08em;
      transition: color var(--transicao);
      padding: 0.2rem 1.4rem;
    }

    .hero-menu a:hover { color: var(--destaque); }

    /* | separator */
    .hero-sep {
      color: var(--destaque);
      font-size: 1.2rem;
      opacity: 0.6;
      user-select: none;
    }

    /* Scroll hint */
    .scroll-dica {
      position: absolute;
      bottom: 2rem;
      right: 2.5rem;
      z-index: 2;
      writing-mode: vertical-rl;
      font-family: var(--detalhe);
      font-size: 0.72rem;
      color: var(--texto2);
      letter-spacing: 0.2em;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 1s ease 1.4s forwards;
    }
    .scroll-dica::after {
      content: '';
      display: block;
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, var(--destaque), transparent);
    }

    /* ══ Mobile responsive ══ */
    @media (max-width: 768px) {
      .hero-texto { padding: 0 1.5rem; }

      .hero-menu {
        flex-direction: column;
        gap: 0;
        width: 100%;
        max-width: 260px;
      }

      .hero-sep { display: none; }

      .hero-menu a {
        font-family: 'LapisDeArtista', 'Caveat', cursive;
        color: #ffffff;
        width: 100%;
        text-align: center;
        padding: 0.9rem 0;
        font-size: 1.8rem;
        border-bottom: 1px solid rgba(255,255,255,0.15);
      }

      .hero-menu a:first-child {
        border-top: 1px solid rgba(255,255,255,0.15);
      }

      .scroll-dica { display: none; }
    }
  </style>
</head>
<body>

  <a href="index.html" class="lang-toggle">PT</a>

  <!-- ═══ TOP BAR — centered on the landing page ════ -->
  <nav id="nav" style="justify-content: center;">
    <a href="index-en.html" class="nav-logo" style="text-align: center;">
      Douglas N. Schimidt
      <small>adventure photography</small>
    </a>
  </nav>

  <!-- ═══ HERO — PHOTO + BIG MENU ══════════════════ -->
  <section class="hero">
    <div class="hero-foto"></div>
    <div class="hero-escuro"></div>

    <div class="hero-texto">
      <h1 class="hero-nome">Adventure<br/>Photography</h1>
      <p class="hero-descricao">Nature seen from within.</p>

      <nav class="hero-menu">
        <a href="portfolio-en.html">Portfolio</a>
        <span class="hero-sep">|</span>
        <a href="portfolio-en.html?loja=1">Shop</a>
        <span class="hero-sep">|</span>
        <a href="expedicoes-en.html">Expeditions</a>
      </nav>
    </div>

    <div class="scroll-dica">scroll</div>
  </section>

  <!-- ═══ FOOTER ═══════════════════════════════════════ -->
  <footer>
    <span class="footer-logo">Douglas N. Schimidt</span>
    <button class="tema-toggle" id="temaToggle" onclick="toggleTema()">Light mode</button>
    <span>© 2026 — Adventure Photography</span>
  </footer>

  <script>
    // Darkens the top bar as the person scrolls
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('rolada', window.scrollY > 50);
    });

    // Opens and closes the mobile menu
    const toggle   = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    if (toggle && navLinks) {
      toggle.addEventListener('click', () => navLinks.classList.toggle('aberto'));
    }
    function fecharMenu() { navLinks?.classList.remove('aberto'); }

    // Light/dark theme toggle
    function toggleTema() {
      const claro = document.documentElement.getAttribute('data-tema') === 'claro';
      if (claro) { document.documentElement.removeAttribute('data-tema'); localStorage.setItem('tema','escuro'); }
      else       { document.documentElement.setAttribute('data-tema','claro'); localStorage.setItem('tema','claro'); }
      atualizarBotaoTema();
    }
    function atualizarBotaoTema() {
      const btn = document.getElementById('temaToggle');
      if (btn) btn.textContent = document.documentElement.getAttribute('data-tema') === 'claro' ? 'Dark mode' : 'Light mode';
    }
    atualizarBotaoTema();
  </script>

</body>
</html>
