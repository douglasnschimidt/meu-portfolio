name: Atualizar galeria via Google Drive

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Atualizar páginas do portfólio
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python atualizar-site.py

      - name: Salvar páginas atualizadas
        run: |
          git config user.name  "Bot do site"
          git config user.email "bot@douglasnschimidt.com"
          git add portfolio.html portfolio-en.html
          git add -u categoria-*.html loja.html 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Portfólio atualizado via Google Drive"
          git push

      - name: Publicar no Netlify
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          RESPOSTA=$(curl -s -w "\n%{http_code}" -X POST "https://api.netlify.com/api/v1/sites/1e91340c-ce15-4497-ad43-663475f7a3d2/deploys" \
            -H "Authorization: Bearer $NETLIFY_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @<(cd . && zip -r - . -x "*.git*" "*.github*" "*.py" "*.yml" "*.md" "*.bak-*" "__pycache__/*" "_to_delete/*" "Claude outputs/*" ".DS_Store"))
          CODIGO=$(echo "$RESPOSTA" | tail -1)
          CORPO=$(echo "$RESPOSTA" | sed '$d')
          echo "Codigo HTTP do Netlify: $CODIGO"
          echo "Resposta do Netlify: $CORPO"
          if [ "$CODIGO" -lt 200 ] || [ "$CODIGO" -ge 300 ]; then
            echo "ERRO: o Netlify recusou o deploy (codigo $CODIGO). Verifique o secret NETLIFY_TOKEN."
            exit 1
          fi
