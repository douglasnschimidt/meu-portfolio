  <style>
    /* ══════════════════════════════════════════════════
       HERO — foto ocupando a tela inteira
    ══════════════════════════════════════════════════ */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* A FOTO DE FUNDO */
    .hero-foto {
      position: absolute;
      inset: 0;
      /*
        ══ COMO TROCAR A FOTO ══════════════════════════
        Troque o endereço abaixo pela sua foto.
        Exemplo com foto local: url('fotos/hero.jpg')
        A foto ideal é horizontal, 1920×1080px ou maior.
        ═════════════════════════════════════════════ */
      background-image: url('DNS09559.jpg');
      background-size: cover;
      background-position: center;
    }

    /* Escurecimento leve — foto fica bem visível */
    .hero-escuro {
      position: absolute;
      inset: 0;
      background: rgba(13,13,13,0.32);
    }

    /* Área do texto — centralizada na landing page */
    .hero-texto {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 2rem;
    }

    .hero-nome { display: none; }
    .hero-descricao { display: none; }

    /* Menu horizontal — fonte caligrafia, cor branca, sem fundo */
    .hero-menu {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.8s forwards;
      position: relative;
      z-index: 10;
      background: none;
    }

    .hero-menu a {
      font-family: 'LapisDeArtista', 'Caveat', cursive;
      font-size: clamp(1.6rem, 2.8vw, 2.4rem);
      color: #ffffff;
      letter-spacing: 0.08em;
      transition: color var(--transicao);
      padding: 0.2rem 1.4rem;
    }

    .hero-menu a:hover { color: var(--destaque); }

    /* Separador | */
    .hero-sep {
      color: var(--destaque);
      font-size: 1.2rem;
      opacity: 0.6;
      user-select: none;
    }

    /* Indicador de scroll */
    .scroll-dica {
      position: absolute;
      bottom: 2rem;
      right: 2.5rem;
      z-index: 2;
      writing-mode: vertical-rl;
      font-family: var(--detalhe);
      font-size: 0.72rem;
      color: var(--texto2);
      letter-spacing: 0.2em;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 1s ease 1.4s forwards;
    }
    .scroll-dica::after {
      content: '';
      display: block;
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, var(--destaque), transparent);
    }

    /* ══ Responsivo celular ══ */
    @media (max-width: 768px) {
      .hero-texto { padding: 0 1.5rem; }

      /* Menu vertical empilhado com linhas separadoras (B mobile) */
      .hero-menu {
        flex-direction: column;
        gap: 0;
        width: 100%;
        max-width: 260px;
      }

      .hero-sep { display: none; }

      .hero-menu a {
        font-family: 'LapisDeArtista', 'Caveat', cursive;
        color: #ffffff;
        width: 100%;
        text-align: center;
        padding: 0.9rem 0;
        font-size: 1.8rem;
        border-bottom: 1px solid rgba(255,255,255,0.15);
      }

      .hero-menu a:first-child {
        border-top: 1px solid rgba(255,255,255,0.15);
      }

      .scroll-dica { display: none; }
    }
  </style>
</head>
<body>

  <!-- ═══ BARRA DE TOPO — centralizada na landing page (C) ════ -->
  <nav id="nav" style="justify-content: center;">
    <a href="index.html" class="nav-logo" style="text-align: center;">
      Douglas N. Schimidt
      <small>adventure photography</small>
    </a>
  </nav>

  <!-- ═══ HERO — FOTO + MENU GRANDE ══════════════════ -->
  <section class="hero">
    <div class="hero-foto"></div>
    <div class="hero-escuro"></div>

    <div class="hero-texto">
      <h1 class="hero-nome">Adventure<br/>Photography</h1>
      <p class="hero-descricao">Natureza vista de dentro.</p>

      <nav class="hero-menu">
        <a href="portfolio.html">Portfólio</a>
        <span class="hero-sep">|</span>
        <a href="portfolio.html?loja=1">Loja</a>
        <span class="hero-sep">|</span>
        <a href="expedicoes.html">Expedições</a>
      </nav>
    </div>

    <div class="scroll-dica">scroll</div>
  </section>

  <!-- ═══ RODAPÉ ═══════════════════════════════════════ -->
  <footer>
    <span class="footer-logo">Douglas N. Schimidt</span>
    <div class="footer-acoes">
      <button class="tema-toggle" id="temaToggle" onclick="toggleTema()">Modo claro</button>
      <a href="index-en.html" class="tema-toggle lang-toggle">EN</a>
    </div>
    <span>© 2026 — Adventure Photography</span>
  </footer>

  <!-- ═══ COMPORTAMENTOS (JavaScript) ═════════════════
       (JavaScript = parte que faz as coisas se moverem
        e reagirem ao clique ou rolagem)
  ════════════════════════════════════════════════════ -->
  <script>
    // Escurece a barra do topo quando a pessoa rola a página
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('rolada', window.scrollY > 50);
    });

    // Abre e fecha o menu no celular
    const toggle   = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    if (toggle && navLinks) {
      toggle.addEventListener('click', () => navLinks.classList.toggle('aberto'));
    }
    function fecharMenu() { navLinks?.classList.remove('aberto'); }

    // Alternância de tema claro/escuro
    function toggleTema() {
      const claro = document.documentElement.getAttribute('data-tema') === 'claro';
      if (claro) { document.documentElement.removeAttribute('data-tema'); localStorage.setItem('tema','escuro'); }
      else       { document.documentElement.setAttribute('data-tema','claro'); localStorage.setItem('tema','claro'); }
      atualizarBotaoTema();
    }
    function atualizarBotaoTema() {
      const btn = document.getElementById('temaToggle');
      if (btn) btn.textContent = document.documentElement.getAttribute('data-tema') === 'claro' ? 'Modo escuro' : 'Modo claro';
    }
    atualizarBotaoTema();
  </script>

</body>
