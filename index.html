<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Douglas N. Schimidt — Adventure Photography</title>
  <meta name="description" content="Fotografia de aventura e natureza — surf, trilhas, escalada." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@400;600&family=Karla:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estilo.css" />

  <style>
    /* ══════════════════════════════════════════════════
       HERO — foto ocupando a tela inteira
    ══════════════════════════════════════════════════ */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      align-items: center;
    }

    /* A FOTO DE FUNDO */
    .hero-foto {
      position: absolute;
      inset: 0;
      /*
        ══ COMO TROCAR A FOTO ══════════════════════════
        Troque o endereço abaixo pela sua foto.
        Exemplo com foto local: url('fotos/hero.jpg')
        A foto ideal é horizontal, 1920×1080px ou maior.
        ═════════════════════════════════════════════ */
      background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80');
      background-size: cover;
      background-position: center;
    }

    /* Escurecimento sobre a foto para o texto aparecer bem */
    .hero-escuro {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(13,13,13,0.88) 0%,
        rgba(13,13,13,0.45) 55%,
        rgba(13,13,13,0.1)  100%
      );
    }

    /* Área do texto — fica à esquerda */
    .hero-texto {
      position: relative;
      z-index: 10;
      padding: 0 3rem;
      max-width: 520px;
      margin-top: 4rem;
    }

    .hero-etiqueta {
      font-family: var(--detalhe);
      font-size: 0.9rem;
      color: var(--destaque);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.2s forwards;
    }

    .hero-nome {
      font-family: var(--titulo);
      font-size: clamp(2.8rem, 6vw, 5rem);
      line-height: 1.05;
      color: var(--texto);
      margin-bottom: 0.6rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.4s forwards;
    }

    .hero-descricao {
      font-family: var(--detalhe);
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--texto2);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.6s forwards;
    }

    /* Links de navegação grandes — o coração da landing page */
    .hero-menu {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.8s forwards;
      position: relative;
      z-index: 10;
    }

    .hero-menu a {
      font-family: var(--titulo);
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--texto2);
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: color var(--transicao), gap var(--transicao);
      width: fit-content;
      cursor: pointer;
      padding: 0.15rem 0;
    }

    /* Traço laranja que aparece ao passar o mouse */
    .hero-menu a::before {
      content: '';
      display: block;
      width: 0;
      height: 1px;
      background: var(--destaque);
      transition: width var(--transicao);
      flex-shrink: 0;
    }

    .hero-menu a:hover {
      color: var(--texto);
      gap: 1.2rem;
    }
    .hero-menu a:hover::before { width: 28px; }

    /* Indicador de scroll */
    .scroll-dica {
      position: absolute;
      bottom: 2rem;
      right: 2.5rem;
      z-index: 2;
      writing-mode: vertical-rl;
      font-family: var(--detalhe);
      font-size: 0.72rem;
      color: var(--texto2);
      letter-spacing: 0.2em;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 1s ease 1.4s forwards;
    }
    .scroll-dica::after {
      content: '';
      display: block;
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, var(--destaque), transparent);
    }

    /* ══ Responsivo celular ══ */
    @media (max-width: 768px) {
      .hero-texto { padding: 0 1.5rem; max-width: 100%; }
      .hero-escuro {
        background: linear-gradient(
          to bottom,
          rgba(13,13,13,0.6) 0%,
          rgba(13,13,13,0.8) 100%
        );
      }
      .scroll-dica { display: none; }
    }
  </style>
</head>
<body>

  <!-- ═══ BARRA DE TOPO ════════════════════════════════ -->
  <nav id="nav">
    <a href="index.html" class="nav-logo">
      Douglas N. Schimidt
      <small>adventure photography</small>
    </a>

    <!-- Botão hamburguer — só aparece no celular -->
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="portfolio.html" onclick="fecharMenu()">Portfólio</a></li>
      <li><a href="portfolio.html?loja=1" onclick="fecharMenu()">Loja</a></li>
      <li><a href="expedicoes.html" onclick="fecharMenu()">Expedições</a></li>
      <li><a href="contato.html"   onclick="fecharMenu()">Contato</a></li>
    </ul>
  </nav>

  <!-- ═══ HERO — FOTO + MENU GRANDE ══════════════════ -->
  <section class="hero">
    <div class="hero-foto"></div>
    <div class="hero-escuro"></div>

    <div class="hero-texto">
      <p class="hero-etiqueta">São Paulo → mundo</p>
      <h1 class="hero-nome">Adventure<br/>Photography</h1>
      <p class="hero-descricao">Natureza vista de dentro.</p>

      <!--
        ══ LINKS DO MENU GRANDE ════════════════════════
        Esses são os links que aparecem em destaque
        na landing page, estilo Burkard.
        Troque os textos se quiser — mas mantenha
        os href (endereços) apontando para os arquivos certos.
        ════════════════════════════════════════════ -->
      <nav class="hero-menu">
        <a href="portfolio.html">Portfólio</a>
        <a href="portfolio.html?loja=1">Loja</a>
        <a href="expedicoes.html">Expedições</a>
        <a href="contato.html">Contato</a>
      </nav>
    </div>

    <div class="scroll-dica">scroll</div>
  </section>

  <!-- ═══ RODAPÉ ═══════════════════════════════════════ -->
  <footer>
    <span class="footer-logo">Douglas N. Schimidt</span>
    <span>© 2025 — Adventure Photography</span>
  </footer>

  <!-- ═══ COMPORTAMENTOS (JavaScript) ═════════════════
       (JavaScript = parte que faz as coisas se moverem
        e reagirem ao clique ou rolagem)
  ════════════════════════════════════════════════════ -->
  <script>
    // Escurece a barra do topo quando a pessoa rola a página
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('rolada', window.scrollY > 50);
    });

    // Abre e fecha o menu no celular
    const toggle   = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    toggle.addEventListener('click', () => navLinks.classList.toggle('aberto'));
    function fecharMenu() { navLinks.classList.remove('aberto'); }
  </script>

</body>
</html>
